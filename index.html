    .bordo::before {

    .bar:after {

    .bar:last-child:after {

}

/* Desktop */
@media (min-width: 1024px) {

    left: 350px;
    width: calc(100vw - 350px);
  }
}

  <!-- OVERLAY -->


  <div
    id="overlay"
    class="fixed inset-0 bg-black/50 hidden z-40">
  </div>


  <!-- SIDEBAR MOBILE -->

  <div
    id="sidebar"
    class="lg:hidden fixed top-0 right-0 h-full w-[200px] md:w-[350px] bg-white p-10 translate-x-full transition-transform duration-700 ease-in-out z-50">

    <div class="flex flex-col h-full">

      <ul class="space-y-4 uppercase font-normal text-sm text-gray-500">

        <li class="hover:text-black">
          <a href="index.html">home</a>
        </li>

        <li class="hover:text-black">
          <a href="work.html">work</a>
        </li>

        <li class="hover:text-black">
          <a href="about.html">about</a>
        </li>

        <li class="hover:text-black">
          <a href="contact.html">contact</a>
        </li>

      </ul>


      <div class="text-sm text-gray-500 pt-10">

        <p>
          © 2026 Cyber <br>
          Created by
          <span class="font-bold">cyberstudio</span>
        </p>

      </div>

    </div>

  </div>


  <!-- JAVASCRIPT MENU -->

  <script>

    document.addEventListener("DOMContentLoaded", function () {

      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const toggleBtn = document.getElementById("sidebar-btn");


      function openSidebar() {

        sidebar.classList.remove("translate-x-full");
        sidebar.classList.add("translate-x-0");

        overlay.classList.remove("hidden");

        document.body.classList.add("overflow-hidden");

      }


      function closeSidebar() {

        sidebar.classList.remove("translate-x-0");
        sidebar.classList.add("translate-x-full");

        overlay.classList.add("hidden");

        document.body.classList.remove("overflow-hidden");

      }


      toggleBtn.addEventListener("click", function () {

        if (sidebar.classList.contains("translate-x-full")) {

          openSidebar();

        } else {

          closeSidebar();

        }

      });


      overlay.addEventListener("click", closeSidebar);


      // Chiude il menu quando clicchi su un link
      const sidebarLinks = sidebar.querySelectorAll("a");

      sidebarLinks.forEach(function (link) {

        link.addEventListener("click", closeSidebar);

      });

    });

  </script>
